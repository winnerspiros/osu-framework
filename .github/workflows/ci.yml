on: [push, pull_request]
name: Continuous Integration

permissions:
  actions: read
  contents: read
  security-events: write # for reporting InspectCode issues

jobs:
  inspect-code:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore Packages
        run: dotnet restore osu-framework.Desktop.slnf

      - name: Restore inspectcode cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/inspectcode
          key: inspectcode-${{ hashFiles('.config/dotnet-tools.json', '.github/workflows/ci.yml', 'osu-framework.sln*', 'osu-framework*.slnf', '.editorconfig', '.globalconfig', 'CodeAnalysis/*', '**/*.csproj', '**/*.props') }}

      - name: Dotnet code style
        run: dotnet build -c Debug -warnaserror osu-framework.Desktop.slnf -p:EnforceCodeStyleInBuild=true

      - name: CodeFileSanity
        run: |
          # TODO: Add ignore filters and GitHub Workflow Command Reporting in CFS. That way we don't have to do this workaround.
          # FIXME: Suppress warnings from templates project and submodules
          exit_code=0
          while read -r line; do
            if [[ ! -z "$line" && "$line" != *"/osu.Framework.Templates/"* && "$line" != *"/submodules/"* ]]; then
              echo "::error::$line"
              exit_code=1
            fi
          done <<< $(dotnet codefilesanity)
          exit $exit_code

      - name: InspectCode
        uses: JetBrains/ReSharper-InspectCode@v0.12
        with:
          # this is WTF tier but if you don't specify *both* of these the defaults assume `build: true`
          build: false
          no-build: true
          solution: ./osu-framework.Desktop.slnf
          caches-home: inspectcode
          verbosity: WARN
          tool-version: 2026.1.0.1
          exclude: '"submodules/**;osu.Framework.Templates/**"'

  test:
    name: Test
    runs-on: ${{matrix.os.fullname}}
    env:
      OSU_EXECUTION_MODE: ${{matrix.threadingMode}}
      OSU_TESTS_LOCAL_HTTPBIN: 1
    strategy:
       fail-fast: false
       matrix:
          os:
            - { prettyname: Windows, fullname: windows-2025-vs2026, configuration: Debug }
            - { prettyname: macOS, fullname: macos-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Release }
          threadingMode: ['SingleThread', 'MultiThreaded']
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          cache: false

      - name: Install httpbin
        run: go install github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@latest

      - name: Run httpbin
        run: $HOME/go/bin/go-httpbin &
        shell: bash

      - name: Compile
        run: dotnet build -c ${{matrix.os.configuration}} -warnaserror osu-framework.Desktop.slnf

      - name: Test
        run: dotnet test $pwd/**/*.Tests/bin/${{matrix.os.configuration}}/*/*.Tests.dll --no-build --logger "trx;LogFileName=TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx" -- NUnit.ConsoleOut=0
        shell: pwsh

      # Attempt to upload results even if test fails.
      # https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#always
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: osu-framework-test-results-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}
          path: ${{github.workspace}}/TestResults/TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx

  build-only-android:
    name: Build only (Android)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Compile
        run: dotnet build -c Debug osu-framework.Android.slnf

  build-only-ios:
    name: Build only (iOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload update && dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use latest Xcode
        run: |
          # Select the highest available Xcode 26.x so the updated workload (net10.0_26.5+) can use it.
          ACTIVE_XCODE=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV | head -1)
          if [ -z "$ACTIVE_XCODE" ]; then
            echo "ERROR: No Xcode_26.x.app found" && exit 1
          fi

          # Resolve to canonical path. Some runners have Xcode_26.5.0.app as a symlink to
          # Xcode_26.5.app; using the symlink path in Settings.plist causes .NET MSBuild
          # to construct SDK paths that xcodebuild/xcrun cannot locate.
          ACTIVE_XCODE=$(readlink -f "$ACTIVE_XCODE" 2>/dev/null || echo "$ACTIVE_XCODE")
          echo "Active Xcode (canonical): $ACTIVE_XCODE"
          sudo xcode-select -switch "$ACTIVE_XCODE"

          # Accept the Xcode license explicitly first — runFirstLaunch may silently skip
          # platform extraction if the license hasn't been accepted yet.
          sudo xcodebuild -license accept 2>&1 | tail -5 || true

          # Run first-launch setup for the newly-selected Xcode (extracts embedded packages
          # including iOS/iPhoneSimulator platform support).
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -5 || true

          # Kill the ibtoold daemon so it restarts from the newly-selected Xcode.
          # A stale daemon from the runner's default Xcode doesn't know about iOS 26.x and
          # causes ibtool to report "iOS XX.X Platform Not Installed" when compiling storyboards.
          sudo pkill -9 ibtoold 2>/dev/null || true

          # Diagnostic: confirm iOS Simulator SDK is present in the selected Xcode.
          echo "=== iPhoneSimulator SDKs ==="
          IOS_SIM_SDKS="$ACTIVE_XCODE/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs"
          ls "$IOS_SIM_SDKS" 2>/dev/null | head -5 || echo "WARNING: iPhoneSimulator SDK not found at $IOS_SIM_SDKS"
          echo "=== xcodebuild showsdks (iOS) ==="
          xcodebuild -showsdks 2>&1 | grep -E 'iphonesimulator|iphoneos' || echo "(no iOS SDKs found)"

          # Pre-create the Xamarin/MAUI settings plist with the selected Xcode path.
          # This works around a crash in AppleSdkSettings..cctor() (net10.0_26.5 SDK) where
          # Directory.CreateDirectory is called with a null path when the settings file is absent.
          mkdir -p "$HOME/Library/Preferences/maui"
          cat > "$HOME/Library/Preferences/maui/Settings.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>AppleSdkRoot</key>
            <string>$ACTIVE_XCODE</string>
          </dict>
          </plist>
          EOF
          echo "Settings.plist written for $ACTIVE_XCODE"

          # MacOSX.sdk fix: some Xcode installs have a stub MacOSX.sdk lacking real content,
          # or worse, circular symlinks (MacOSX.sdk → MacOSX26.5.sdk → MacOSX.sdk) causing ELOOP.
          # On Xcode 15+, headers moved out of usr/include; use System/Library/Frameworks count instead.
          # Real SDKs have 100+ frameworks; stubs/broken symlinks have 0.
          SDKS_DIR="$ACTIVE_XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          MACOS_SDK="$SDKS_DIR/MacOSX.sdk"
          echo "=== MacOSX.sdk state ==="
          ls -la "$SDKS_DIR" 2>&1 || echo "(SDKs dir does not exist)"

          # Phase 1: Detect and remove broken/circular symlinks in the SDKs directory.
          # A circular symlink causes ELOOP (errno=Too many levels of symbolic links) which
          # makes xcrun/xcodebuild unable to locate actool or any SDK tools.
          echo "--- Checking for broken/circular symlinks ---"
          for sdk_entry in $(ls "$SDKS_DIR" 2>/dev/null | grep '\.sdk$'); do
            entry_path="$SDKS_DIR/$sdk_entry"
            if [ -L "$entry_path" ]; then
              # stat follows symlinks - if it fails, the symlink is broken or circular
              if ! stat "$entry_path" > /dev/null 2>&1; then
                echo "  Removing broken/circular symlink: $sdk_entry (target: $(readlink "$entry_path"))"
                sudo rm -f "$entry_path"
              fi
            fi
          done

          # Phase 2: Check if MacOSX.sdk now exists with real content
          _current_fw=$(ls "$MACOS_SDK/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
          _has_library=$([ -d "$MACOS_SDK/Library" ] && echo "yes" || echo "no")
          echo "MacOSX.sdk: $_current_fw frameworks, has Library dir: $_has_library"

          REAL_SDK=""
          if [ "${_current_fw:-0}" -gt 50 ]; then
            echo "MacOSX.sdk already has real content ($_current_fw frameworks) – no fix needed"
          else
            echo "MacOSX.sdk is missing or broken (frameworks=$_current_fw, Library=$_has_library) — searching for real SDK..."

            # Search for real (non-symlink) versioned SDK directories across all Xcode installs.
            for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
              xapp=$(readlink -f "$xapp" 2>/dev/null || echo "$xapp")
              sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
              [ -d "$sdk_dir" ] || continue
              for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '^MacOSX[0-9]' | sort -rV); do
                cand="$sdk_dir/$sdk"
                # Skip symlinks — they may be part of the circular chain we just cleaned up
                [ -L "$cand" ] && continue
                fw_count=$(ls "$cand/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
                echo "  Checking (dir) $cand: $fw_count frameworks"
                if [ "${fw_count:-0}" -gt 50 ]; then
                  REAL_SDK="$cand"
                  echo "Found real macOS SDK: $REAL_SDK"
                  break 2
                fi
              done
            done

            # Fallback: use find to locate any real SDK directory (not symlink) system-wide
            if [ -z "$REAL_SDK" ]; then
              echo "  Searching with find for real SDK directories..."
              for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
                xapp=$(readlink -f "$xapp" 2>/dev/null || echo "$xapp")
                sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
                cand=$(find "$sdk_dir" -maxdepth 1 -type d -name 'MacOSX*.sdk' 2>/dev/null | head -1)
                if [ -n "$cand" ]; then
                  fw_count=$(ls "$cand/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
                  echo "  Found directory: $cand ($fw_count frameworks)"
                  if [ "${fw_count:-0}" -gt 50 ]; then
                    REAL_SDK="$cand"
                    break
                  fi
                fi
              done
            fi

            # Fallback: CommandLineTools (versioned only, non-symlink)
            if [ -z "$REAL_SDK" ]; then
              for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX[0-9]' | sort -rV); do
                cand="/Library/Developer/CommandLineTools/SDKs/$sdk"
                [ -L "$cand" ] && continue
                fw_count=$(ls "$cand/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
                echo "  CLT $cand: $fw_count frameworks"
                if [ "${fw_count:-0}" -gt 50 ]; then
                  REAL_SDK="$cand"
                  echo "Found macOS SDK in CLT: $REAL_SDK"
                  break
                fi
              done
            fi

            # Last resort: CommandLineTools even if symlink (the target might be valid if NOT in the same dir)
            if [ -z "$REAL_SDK" ]; then
              for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX' | sort -rV); do
                cand="/Library/Developer/CommandLineTools/SDKs/$sdk"
                # Must be stat-able (not broken/circular)
                stat "$cand" > /dev/null 2>&1 || continue
                fw_count=$(ls "$cand/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
                echo "  CLT (any) $cand: $fw_count frameworks"
                if [ "${fw_count:-0}" -gt 50 ]; then
                  REAL_SDK="$cand"
                  echo "Found macOS SDK in CLT (symlink OK): $REAL_SDK"
                  break
                fi
              done
            fi

            if [ -n "$REAL_SDK" ]; then
              sudo rm -rf "$MACOS_SDK"
              sudo ln -sfn "$REAL_SDK" "$MACOS_SDK"
              echo "Created MacOSX.sdk symlink -> $REAL_SDK"
            else
              echo "WARNING: no usable macOS SDK found; listing all candidates:"
              for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
                sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
                echo "  $xapp:"; ls -la "$sdk_dir" 2>&1 | sed 's/^/    /'
              done
              ls -la /Library/Developer/CommandLineTools/SDKs/ 2>&1 | sed 's/^/  CLT: /'
            fi
          fi
          echo "=== MacOSX.sdk state after fix ==="
          ls -la "$SDKS_DIR" 2>&1 || echo "(does not exist)"
          echo "--- xcrun validation ---"
          xcrun --sdk macosx --show-sdk-path 2>&1 || echo "(xcrun failed)"
          xcodebuild -sdk macosx -version 2>&1 | head -5 || echo "(xcodebuild cannot locate macosx SDK)"

      - name: Compile
        run: dotnet build -c Debug osu-framework.iOS.slnf

