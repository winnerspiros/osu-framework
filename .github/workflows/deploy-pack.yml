name: Pack and nuget

on:
  push:
    tags:
      - '*'

jobs:
  notify_pending_production_deploy:
    runs-on: ubuntu-latest
    steps:
      -
        name: Submit pending deployment notification
        run: |
          export TITLE="Pending osu-framework Production Deployment: $GITHUB_REF_NAME"
          export URL="https://github.com/ppy/osu-framework/actions/runs/$GITHUB_RUN_ID"
          export DESCRIPTION="Awaiting approval for building NuGet packages for tag $GITHUB_REF_NAME:
          [View Workflow Run]($URL)"
          export ACTOR_ICON="https://avatars.githubusercontent.com/u/$GITHUB_ACTOR_ID"

          BODY="$(jq --null-input '{
            "embeds": [
              {
                "title": env.TITLE,
                "color": 15098112,
                "description": env.DESCRIPTION,
                "url": env.URL,
                "author": {
                  "name": env.GITHUB_ACTOR,
                  "icon_url": env.ACTOR_ICON
                }
              }
            ]
          }')"

          curl \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${{ secrets.DISCORD_INFRA_WEBHOOK_URL }}"

  pack-framework:
    name: Pack (Framework)
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Pack (Framework)
        run: dotnet pack -c Release osu.Framework /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework
          path: |
            ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg
            ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.snupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  pack-template:
    name: Pack (Templates)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set artifacts Directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Replace project references
        run: osu.Framework.Templates/replace-references.sh ${{ github.ref_name }}

      - name: Pack (Template)
        run: dotnet pack -c Release osu.Framework.Templates /p:Configuration=Release /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true /p:NoDefaultExcludes=true -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-templates
          path: ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  pack-android:
    name: Pack (Android)
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Pack (Android Framework)
        run: dotnet pack -c Release osu.Framework.Android /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true  -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-android
          path: ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  pack-ios:
    name: Pack (iOS)
    runs-on: macos-26
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET Workloads
        run: dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use Xcode 26.4+
        run: |
          # Prefer the latest Xcode >= 26.4. The .NET iOS workload (net10.0_26.4) requires
          # Xcode >= 26.4; later versions (e.g. 26.5 beta) are compatible and may ship a
          # working MacOSX.sdk rather than the stub in Xcode_26.4.1.app.
          ACTIVE_XCODE=""
          for xapp in /Applications/Xcode_26.5.app /Applications/Xcode_26.4.app; do
            [ -d "$xapp" ] && ACTIVE_XCODE="$xapp" && break
          done
          echo "Using Xcode: $ACTIVE_XCODE"
          sudo xcode-select -switch "$ACTIVE_XCODE"
          # The .NET iOS SDK (Microsoft.iOS.Sdk.net10.0_26.4) constructs the MacOSX.sdk path
          # from the active Xcode developer directory and passes it to xcodebuild as a full
          # absolute path. On macos-26, Xcode_26.4.1.app ships MacOSX.sdk as a minimal stub
          # that xcodebuild rejects when given the full path. Note: `xcodebuild -sdk macosx
          # -version` exits 0 even with the stub (resolves by internal registry, not path) —
          # it cannot be used as a guard. Fix: always replace MacOSX.sdk with a symlink to
          # the best real versioned SDK from another Xcode install.
          SDKS_DIR="$ACTIVE_XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          MACOS_SDK="$SDKS_DIR/MacOSX.sdk"
          echo "=== MacOSX.sdk state ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          REAL_SDK=""
          # Extract version segment (e.g. Xcode_26.5) to exclude from search — its SDK
          # variants may also be stubs. All other Xcode_26.*.app installs are candidates.
          EXCLUDE=$(basename "$ACTIVE_XCODE" | grep -oE '^Xcode_26\.[0-9]+')
          for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | grep -v "/$EXCLUDE" | sort -rV); do
            sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
            [ -d "$sdk_dir" ] || continue
            for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              if [ -f "$sdk_dir/$sdk/SDKSettings.plist" ]; then
                REAL_SDK="$sdk_dir/$sdk"
                echo "Found real macOS SDK in $xapp: $REAL_SDK"
                break 2
              fi
            done
          done
          # Fallback: CommandLineTools (macOS 15.x — last resort)
          if [ -z "$REAL_SDK" ]; then
            for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              if [ -f "/Library/Developer/CommandLineTools/SDKs/$sdk/SDKSettings.plist" ]; then
                REAL_SDK="/Library/Developer/CommandLineTools/SDKs/$sdk"
                echo "Found macOS SDK in CLT: $REAL_SDK"
                break
              fi
            done
          fi
          if [ -n "$REAL_SDK" ]; then
            sudo rm -rf "$MACOS_SDK"
            sudo ln -sfn "$REAL_SDK" "$MACOS_SDK"
            echo "Created MacOSX.sdk symlink -> $REAL_SDK"
          else
            echo "WARNING: no valid macOS SDK found in any Xcode or CLT installation"
            for dir in "$SDKS_DIR" /Library/Developer/CommandLineTools/SDKs; do
              echo "=== $dir ==="; ls -la "$dir" 2>&1 || true
            done
          fi
          echo "=== MacOSX.sdk state after fix ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          xcodebuild -sdk macosx -version 2>&1 || echo "(xcodebuild cannot locate macosx SDK)"

      - name: Pack (iOS Framework)
        run: dotnet pack -c Release osu.Framework.iOS /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-ios
          path: ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
