on: [push, pull_request]
name: Continuous Integration

permissions:
  actions: read
  contents: read
  security-events: write # for reporting InspectCode issues

jobs:
  inspect-code:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore Packages
        run: dotnet restore osu-framework.Desktop.slnf

      - name: Restore inspectcode cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/inspectcode
          key: inspectcode-${{ hashFiles('.config/dotnet-tools.json', '.github/workflows/ci.yml', 'osu-framework.sln*', 'osu-framework*.slnf', '.editorconfig', '.globalconfig', 'CodeAnalysis/*', '**/*.csproj', '**/*.props') }}

      - name: Dotnet code style
        run: dotnet build -c Debug -warnaserror osu-framework.Desktop.slnf -p:EnforceCodeStyleInBuild=true

      - name: CodeFileSanity
        run: |
          # TODO: Add ignore filters and GitHub Workflow Command Reporting in CFS. That way we don't have to do this workaround.
          # FIXME: Suppress warnings from templates project and submodules
          exit_code=0
          while read -r line; do
            if [[ ! -z "$line" && "$line" != *"/osu.Framework.Templates/"* && "$line" != *"/submodules/"* ]]; then
              echo "::error::$line"
              exit_code=1
            fi
          done <<< $(dotnet codefilesanity)
          exit $exit_code

      - name: InspectCode
        uses: JetBrains/ReSharper-InspectCode@v0.12
        with:
          # this is WTF tier but if you don't specify *both* of these the defaults assume `build: true`
          build: false
          no-build: true
          solution: ./osu-framework.Desktop.slnf
          caches-home: inspectcode
          verbosity: WARN
          tool-version: 2026.1.0.1
          additional-arguments: '--exclude=submodules/**;osu.Framework.Templates/**'

  test:
    name: Test
    runs-on: ${{matrix.os.fullname}}
    env:
      OSU_EXECUTION_MODE: ${{matrix.threadingMode}}
      OSU_TESTS_LOCAL_HTTPBIN: 1
    strategy:
       fail-fast: false
       matrix:
          os:
            - { prettyname: Windows, fullname: windows-2025-vs2026, configuration: Debug }
            - { prettyname: macOS, fullname: macos-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Release }
          threadingMode: ['SingleThread', 'MultiThreaded']
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          cache: false

      - name: Install httpbin
        run: go install github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@latest

      - name: Run httpbin
        run: $HOME/go/bin/go-httpbin &
        shell: bash

      - name: Compile
        run: dotnet build -c ${{matrix.os.configuration}} -warnaserror osu-framework.Desktop.slnf

      - name: Test
        run: dotnet test $pwd/**/*.Tests/bin/${{matrix.os.configuration}}/*/*.Tests.dll --no-build --logger "trx;LogFileName=TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx" -- NUnit.ConsoleOut=0
        shell: pwsh

      # Attempt to upload results even if test fails.
      # https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#always
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: osu-framework-test-results-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}
          path: ${{github.workspace}}/TestResults/TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx

  build-only-android:
    name: Build only (Android)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Compile
        run: dotnet build -c Debug osu-framework.Android.slnf

  build-only-ios:
    name: Build only (iOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload update && dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use latest Xcode
        run: |
          # Select the highest available Xcode 26.x so the updated workload (net10.0_26.5+) can use it.
          ACTIVE_XCODE=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV | head -1)
          if [ -z "$ACTIVE_XCODE" ]; then
            echo "ERROR: No Xcode_26.x.app found" && exit 1
          fi
          echo "Active Xcode: $ACTIVE_XCODE"
          sudo xcode-select -switch "$ACTIVE_XCODE"

          # Run first-launch setup for the newly-selected Xcode (accepts license, extracts embedded
          # packages including iOS/iPhoneSimulator platform support).  Without this, ibtool fails
          # with "iOS XX.X Platform Not Installed" when processing storyboards for a beta Xcode.
          sudo xcodebuild -runFirstLaunch 2>&1 || true

          # Pre-create the Xamarin/MAUI settings plist with the selected Xcode path.
          # This works around a crash in AppleSdkSettings..cctor() (net10.0_26.5 SDK) where
          # Directory.CreateDirectory is called with a null path when the settings file is absent.
          mkdir -p "$HOME/Library/Preferences/maui"
          cat > "$HOME/Library/Preferences/maui/Settings.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>AppleSdkRoot</key>
            <string>$ACTIVE_XCODE</string>
          </dict>
          </plist>
          EOF
          echo "Settings.plist written for $ACTIVE_XCODE"

          # MacOSX.sdk fix: some Xcode installs have a stub MacOSX.sdk lacking real content.
          # On Xcode 15+, headers moved out of usr/include; use System/Library/Frameworks count instead.
          # Real SDKs have 100+ frameworks; stubs have 0.
          SDKS_DIR="$ACTIVE_XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          MACOS_SDK="$SDKS_DIR/MacOSX.sdk"
          echo "=== MacOSX.sdk state ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"

          # Check if the current MacOSX.sdk already has real content (resolving symlinks).
          # IMPORTANT: only search VERSIONED SDKs (MacOSX[0-9]*.sdk) to avoid creating
          # a circular symlink when MacOSX.sdk itself resolves to the same path as REAL_SDK.
          _resolved=$(readlink -f "$MACOS_SDK" 2>/dev/null || echo "$MACOS_SDK")
          _current_fw=$(ls "$_resolved/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
          echo "Current MacOSX.sdk (resolved: $_resolved): $_current_fw frameworks"

          REAL_SDK=""
          if [ "${_current_fw:-0}" -gt 50 ]; then
            echo "MacOSX.sdk already has real content – no fix needed"
          else
            # Search all Xcode_26.x.app installs for a VERSIONED sdk with real frameworks.
            # Do NOT include the unversioned MacOSX.sdk to avoid circular symlinks.
            for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
              sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
              [ -d "$sdk_dir" ] || continue
              for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '^MacOSX[0-9]' | sort -rV); do
                cand="$sdk_dir/$sdk"
                fw_count=$(ls "$cand/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
                echo "  Checking $cand: $fw_count frameworks"
                if [ "${fw_count:-0}" -gt 50 ]; then
                  REAL_SDK="$cand"
                  echo "Found real macOS SDK: $REAL_SDK"
                  break 2
                fi
              done
            done
            # Fallback: CommandLineTools (versioned only)
            if [ -z "$REAL_SDK" ]; then
              for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX[0-9]' | sort -rV); do
                cand="/Library/Developer/CommandLineTools/SDKs/$sdk"
                fw_count=$(ls "$cand/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ')
                echo "  CLT $cand: $fw_count frameworks"
                if [ "${fw_count:-0}" -gt 50 ]; then
                  REAL_SDK="$cand"
                  echo "Found macOS SDK in CLT: $REAL_SDK"
                  break
                fi
              done
            fi
            if [ -n "$REAL_SDK" ]; then
              sudo rm -rf "$MACOS_SDK"
              sudo ln -sfn "$REAL_SDK" "$MACOS_SDK"
              echo "Created MacOSX.sdk symlink -> $REAL_SDK"
            else
              echo "WARNING: no versioned macOS SDK found; listing all candidates:"
              for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
                sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
                echo "  $xapp:"; ls "$sdk_dir" 2>&1 | sed 's/^/    /'
                for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '\.sdk$'); do
                  echo "    $sdk: $(ls "$sdk_dir/$sdk/System/Library/Frameworks" 2>/dev/null | wc -l | tr -d ' ') frameworks"
                done
              done
            fi
          fi
          echo "=== MacOSX.sdk state after fix ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          xcodebuild -sdk macosx -version 2>&1 || echo "(xcodebuild cannot locate macosx SDK)"

      - name: Compile
        run: dotnet build -c Debug osu-framework.iOS.slnf

