name: One-Click Pack & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 2026.420.1)'
        required: true
        type: string
      publish_github:
        description: 'Publish to GitHub Packages'
        required: false
        default: true
        type: boolean
      publish_nuget:
        description: 'Publish to nuget.org'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  pack-framework:
    name: Pack (Framework)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set artifacts directory
        id: dirs
        run: echo "ARTIFACTS=${{ github.workspace }}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Pack (Framework)
        run: >
          dotnet pack -c Release osu.Framework
          /p:Version=${{ inputs.version }}
          /p:GenerateDocumentationFile=true
          /p:IncludeSymbols=true
          /p:SymbolPackageFormat=snupkg
          -o "${{ steps.dirs.outputs.ARTIFACTS }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework
          path: |
            ${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg
            ${{ steps.dirs.outputs.ARTIFACTS }}\*.snupkg

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_github }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Publish to nuget.org
        if: ${{ inputs.publish_nuget }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  pack-android:
    name: Pack (Android)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Set artifacts directory
        id: dirs
        run: echo "ARTIFACTS=${{ github.workspace }}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Pack (Android Framework)
        run: >
          dotnet pack -c Release osu.Framework.Android
          /p:Version=${{ inputs.version }}
          /p:GenerateDocumentationFile=true
          -o "${{ steps.dirs.outputs.ARTIFACTS }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-android
          path: ${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_github }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Publish to nuget.org
        if: ${{ inputs.publish_nuget }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  pack-ios:
    name: Pack (iOS)
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET Workloads
        run: dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use Xcode 26.4
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.4.app
          # On macos-26, MacOSX.sdk and ALL versioned siblings in Xcode_26.4.app are stubs or circular
          # symlinks with no SDKSettings.plist.  xcodebuild requires a real macOS 26.x SDK — search other
          # Xcode_26.*.app installs (newest first, excluding 26.4 whose SDKs are all stubs) BEFORE falling
          # back to CommandLineTools (which only has a macOS 15.x SDK, too old for Xcode 26.4).
          SDKS_DIR="/Applications/Xcode_26.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          MACOS_SDK="$SDKS_DIR/MacOSX.sdk"
          echo "=== MacOSX.sdk state ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          ls -la "$MACOS_SDK/SDKSettings.plist" 2>&1 || echo "(no SDKSettings.plist)"
          if [ -L "$MACOS_SDK" ]; then echo "symlink target: $(readlink "$MACOS_SDK")"; fi
          if [ ! -f "$MACOS_SDK/SDKSettings.plist" ]; then
            REAL_SDK=""
            # Search other Xcode_26.*.app installs first (have macOS 26.x SDKs); CLT is last resort
            # (CLT only has macOS 15.x SDK which xcodebuild 26.x rejects).  Skip MacOSX.sdk itself
            # (it may also be a symlink or stub); only consider versioned entries like MacOSX26.3.sdk.
            for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | grep -v '/Xcode_26\.4\.app$' | sort -rV); do
              sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
              [ -d "$sdk_dir" ] || continue
              for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
                if [ -f "$sdk_dir/$sdk/SDKSettings.plist" ]; then
                  REAL_SDK="$sdk_dir/$sdk"
                  echo "Found macOS SDK in $xapp: $REAL_SDK"
                  break 2
                fi
              done
            done
            # Fallback: CommandLineTools (macOS 15.x — better than nothing)
            if [ -z "$REAL_SDK" ]; then
              for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
                if [ -f "/Library/Developer/CommandLineTools/SDKs/$sdk/SDKSettings.plist" ]; then
                  REAL_SDK="/Library/Developer/CommandLineTools/SDKs/$sdk"
                  echo "Found macOS SDK in CLT: $REAL_SDK"
                  break
                fi
              done
            fi
            if [ -n "$REAL_SDK" ]; then
              sudo rm -rf "$MACOS_SDK"
              sudo ln -sfn "$REAL_SDK" "$MACOS_SDK"
              echo "Created MacOSX.sdk symlink -> $REAL_SDK"
            else
              echo "WARNING: no valid macOS SDK found in any Xcode or CLT installation"
              for dir in "$SDKS_DIR" /Library/Developer/CommandLineTools/SDKs; do
                echo "=== $dir ==="; ls -la "$dir" 2>&1 || true
              done
            fi
          fi
          echo "=== MacOSX.sdk state after fix ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"

      - name: Set artifacts directory
        id: dirs
        run: echo "ARTIFACTS=${{ github.workspace }}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Pack (iOS Framework)
        run: >
          dotnet pack -c Release osu.Framework.iOS
          /p:Version=${{ inputs.version }}
          /p:GenerateDocumentationFile=true
          -o "${{ steps.dirs.outputs.ARTIFACTS }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-ios
          path: ${{ steps.dirs.outputs.ARTIFACTS }}/*.nupkg

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_github }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}"/*.nupkg
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Publish to nuget.org
        if: ${{ inputs.publish_nuget }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}"/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
