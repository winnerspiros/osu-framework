name: Pack and nuget

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  notify_pending_production_deploy:
    runs-on: ubuntu-latest
    steps:
      -
        name: Submit pending deployment notification
        run: |
          export TITLE="Pending osu-framework Production Deployment: $GITHUB_REF_NAME"
          export URL="https://github.com/ppy/osu-framework/actions/runs/$GITHUB_RUN_ID"
          export DESCRIPTION="Awaiting approval for building NuGet packages for tag $GITHUB_REF_NAME:
          [View Workflow Run]($URL)"
          export ACTOR_ICON="https://avatars.githubusercontent.com/u/$GITHUB_ACTOR_ID"

          BODY="$(jq --null-input '{
            "embeds": [
              {
                "title": env.TITLE,
                "color": 15098112,
                "description": env.DESCRIPTION,
                "url": env.URL,
                "author": {
                  "name": env.GITHUB_ACTOR,
                  "icon_url": env.ACTOR_ICON
                }
              }
            ]
          }')"

          curl \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${{ secrets.DISCORD_INFRA_WEBHOOK_URL }}"

  # Publish the vendored SDL3-CS package to GitHub Packages so that osu consumers
  # can resolve the ppy.SDL3-CS dependency when they install ppy.osu.Framework from our feed.
  publish-sdl3-cs:
    name: Publish SDL3-CS to GitHub Packages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish SDL3-CS to GitHub Packages
        run: |
          PKG=$(ls nuget-local/ppy.SDL3-CS.*.nupkg 2>/dev/null | sort -V | tail -1)
          if [ -z "$PKG" ]; then
            echo "No ppy.SDL3-CS nupkg found in nuget-local/ — skipping." && exit 0
          fi
          dotnet nuget push "$PKG" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

  pack-framework:
    name: Pack (Framework)
    needs: publish-sdl3-cs
    runs-on: windows-2025-vs2026
    environment: production
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Pack (Framework)
        run: dotnet pack -c Release osu.Framework /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework
          path: |
            ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg
            ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.snupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  pack-template:
    name: Pack (Templates)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set artifacts Directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Replace project references
        run: osu.Framework.Templates/replace-references.sh ${{ github.ref_name }}

      - name: Pack (Template)
        run: dotnet pack -c Release osu.Framework.Templates /p:Configuration=Release /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true /p:NoDefaultExcludes=true -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-templates
          path: ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  pack-android:
    name: Pack (Android)
    needs: publish-sdl3-cs
    runs-on: windows-2025-vs2026
    environment: production
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Pack (Android Framework)
        run: dotnet pack -c Release osu.Framework.Android /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true  -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-android
          path: ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  pack-ios:
    name: Pack (iOS)
    needs: publish-sdl3-cs
    runs-on: macos-26
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set artifacts directory
        id: artifactsPath
        run: echo "NUGET_ARTIFACTS=${{github.workspace}}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET Workloads
        run: dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use Xcode 26.4
        run: |
          # Pin to Xcode 26.4 — the .NET iOS workload (net10.0_26.4) requires exactly Xcode 26.4.
          # Using Xcode 26.5 causes a hard build failure: "requires Xcode 26.4, current is 26.5".
          # Fix: MacOSX.sdk in Xcode 26.4 is a minimal stub. Replace it with a symlink to the
          # real versioned SDK found across Xcode installs. Real SDKs have hundreds of headers;
          # stubs have ≤1.
          ACTIVE_XCODE="/Applications/Xcode_26.4.app"
          echo "Active Xcode: $ACTIVE_XCODE"
          sudo xcode-select -switch "$ACTIVE_XCODE"
          SDKS_DIR="$ACTIVE_XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          MACOS_SDK="$SDKS_DIR/MacOSX.sdk"
          echo "=== MacOSX.sdk state ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          REAL_SDK=""
          # Search ALL Xcode_26.x.app installs (including active) for versioned MacOSX[N].sdk.
          # Validate by usr/include header count: stubs ≤1 file, real SDKs have hundreds.
          for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
            sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
            [ -d "$sdk_dir" ] || continue
            for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              cand="$sdk_dir/$sdk"
              hdr_count=$(ls "$cand/usr/include" 2>/dev/null | wc -l | tr -d ' ')
              echo "  Checking $cand: $hdr_count headers in usr/include"
              if [ "${hdr_count:-0}" -gt 5 ]; then
                REAL_SDK="$cand"
                echo "Found real macOS SDK: $REAL_SDK"
                break 2
              fi
            done
          done
          # Fallback: CommandLineTools
          if [ -z "$REAL_SDK" ]; then
            for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              cand="/Library/Developer/CommandLineTools/SDKs/$sdk"
              hdr_count=$(ls "$cand/usr/include" 2>/dev/null | wc -l | tr -d ' ')
              echo "  CLT $cand: $hdr_count headers"
              if [ "${hdr_count:-0}" -gt 5 ]; then
                REAL_SDK="$cand"
                echo "Found macOS SDK in CLT: $REAL_SDK"
                break
              fi
            done
          fi
          if [ -n "$REAL_SDK" ]; then
            sudo rm -rf "$MACOS_SDK"
            sudo ln -sfn "$REAL_SDK" "$MACOS_SDK"
            echo "Created MacOSX.sdk symlink -> $REAL_SDK"
          else
            echo "WARNING: no valid macOS SDK found; listing all candidates:"
            for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
              sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
              echo "  $xapp:"; ls "$sdk_dir" 2>&1 | sed 's/^/    /'
              for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '\.sdk$'); do
                echo "    $sdk: $(ls "$sdk_dir/$sdk" 2>/dev/null | wc -l | tr -d ' ') items, $(ls "$sdk_dir/$sdk/usr/include" 2>/dev/null | wc -l | tr -d ' ') hdrs"
              done
            done
          fi
          echo "=== MacOSX.sdk state after fix ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          xcodebuild -sdk macosx -version 2>&1 || echo "(xcodebuild cannot locate macosx SDK)"

      - name: Pack (iOS Framework)
        run: dotnet pack -c Release osu.Framework.iOS /p:Version=${{ github.ref_name }} /p:GenerateDocumentationFile=true -o ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-ios
          path: ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg

      - name: Publish packages to nuget.org
        run: dotnet nuget push ${{steps.artifactsPath.outputs.NUGET_ARTIFACTS}}/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
