name: One-Click Pack & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 2026.420.1)'
        required: true
        type: string
      publish_github:
        description: 'Publish to GitHub Packages'
        required: false
        default: true
        type: boolean
      publish_nuget:
        description: 'Publish to nuget.org'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  pack-framework:
    name: Pack (Framework)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set artifacts directory
        id: dirs
        run: echo "ARTIFACTS=${{ github.workspace }}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Pack (Framework)
        run: >
          dotnet pack -c Release osu.Framework
          /p:Version=${{ inputs.version }}
          /p:GenerateDocumentationFile=true
          /p:IncludeSymbols=true
          /p:SymbolPackageFormat=snupkg
          -o "${{ steps.dirs.outputs.ARTIFACTS }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework
          path: |
            ${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg
            ${{ steps.dirs.outputs.ARTIFACTS }}\*.snupkg

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_github }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Publish to nuget.org
        if: ${{ inputs.publish_nuget }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  pack-android:
    name: Pack (Android)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Set artifacts directory
        id: dirs
        run: echo "ARTIFACTS=${{ github.workspace }}\artifacts" >> $env:GITHUB_OUTPUT

      - name: Pack (Android Framework)
        run: >
          dotnet pack -c Release osu.Framework.Android
          /p:Version=${{ inputs.version }}
          /p:GenerateDocumentationFile=true
          -o "${{ steps.dirs.outputs.ARTIFACTS }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-android
          path: ${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_github }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Publish to nuget.org
        if: ${{ inputs.publish_nuget }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}\*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  pack-ios:
    name: Pack (iOS)
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET Workloads
        run: |
          dotnet workload update
          dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use latest Xcode
        run: |
          # Use the latest Xcode available on the runner (26.5 beta or newer).
          # dotnet workload update (above) fetches the latest workload manifest which
          # should include net10.0_26.5 support matching the latest Xcode.
          # Fix: MacOSX.sdk in the active Xcode is a minimal stub. Replace it with a symlink
          # to the real versioned SDK (MacOSX26.5.sdk) found in the same or newer Xcode.
          # Real SDKs have hundreds of headers in usr/include; stubs have ≤1.
          ACTIVE_XCODE=""
          for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
            [ -d "$xapp" ] && ACTIVE_XCODE="$xapp" && break
          done
          echo "Active Xcode: $ACTIVE_XCODE"
          sudo xcode-select -switch "$ACTIVE_XCODE"
          SDKS_DIR="$ACTIVE_XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          MACOS_SDK="$SDKS_DIR/MacOSX.sdk"
          echo "=== MacOSX.sdk state ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          REAL_SDK=""
          # Search ALL Xcode_26.x.app installs (including active) for versioned MacOSX[N].sdk.
          # Validate by usr/include header count: stubs ≤1 file, real SDKs have hundreds.
          for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
            sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
            [ -d "$sdk_dir" ] || continue
            for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              cand="$sdk_dir/$sdk"
              hdr_count=$(ls "$cand/usr/include" 2>/dev/null | wc -l | tr -d ' ')
              echo "  Checking $cand: $hdr_count headers in usr/include"
              if [ "${hdr_count:-0}" -gt 5 ]; then
                REAL_SDK="$cand"
                echo "Found real macOS SDK: $REAL_SDK"
                break 2
              fi
            done
          done
          # Fallback: CommandLineTools
          if [ -z "$REAL_SDK" ]; then
            for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              cand="/Library/Developer/CommandLineTools/SDKs/$sdk"
              hdr_count=$(ls "$cand/usr/include" 2>/dev/null | wc -l | tr -d ' ')
              echo "  CLT $cand: $hdr_count headers"
              if [ "${hdr_count:-0}" -gt 5 ]; then
                REAL_SDK="$cand"
                echo "Found macOS SDK in CLT: $REAL_SDK"
                break
              fi
            done
          fi
          if [ -n "$REAL_SDK" ]; then
            sudo rm -rf "$MACOS_SDK"
            sudo ln -sfn "$REAL_SDK" "$MACOS_SDK"
            echo "Created MacOSX.sdk symlink -> $REAL_SDK"
          else
            echo "WARNING: no valid macOS SDK found; listing all candidates:"
            for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -rV); do
              sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
              echo "  $xapp:"; ls "$sdk_dir" 2>&1 | sed 's/^/    /'
              for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '\.sdk$'); do
                echo "    $sdk: $(ls "$sdk_dir/$sdk" 2>/dev/null | wc -l | tr -d ' ') items, $(ls "$sdk_dir/$sdk/usr/include" 2>/dev/null | wc -l | tr -d ' ') hdrs"
              done
            done
          fi
          echo "=== MacOSX.sdk state after fix ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          xcodebuild -sdk macosx -version 2>&1 || echo "(xcodebuild cannot locate macosx SDK)"

      - name: Set artifacts directory
        id: dirs
        run: echo "ARTIFACTS=${{ github.workspace }}/artifacts" >> "$GITHUB_OUTPUT"

      - name: Pack (iOS Framework)
        run: >
          dotnet pack -c Release osu.Framework.iOS
          /p:Version=${{ inputs.version }}
          /p:GenerateDocumentationFile=true
          -o "${{ steps.dirs.outputs.ARTIFACTS }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osu-framework-ios
          path: ${{ steps.dirs.outputs.ARTIFACTS }}/*.nupkg

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_github }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}"/*.nupkg
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Publish to nuget.org
        if: ${{ inputs.publish_nuget }}
        run: >
          dotnet nuget push "${{ steps.dirs.outputs.ARTIFACTS }}"/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
