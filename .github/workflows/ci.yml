on: [push, pull_request]
name: Continuous Integration

permissions:
  actions: read
  contents: read
  security-events: write # for reporting InspectCode issues

jobs:
  inspect-code:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore Packages
        run: dotnet restore osu-framework.Desktop.slnf

      - name: Restore inspectcode cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/inspectcode
          key: inspectcode-${{ hashFiles('.config/dotnet-tools.json', '.github/workflows/ci.yml', 'osu-framework.sln*', 'osu-framework*.slnf', '.editorconfig', '.globalconfig', 'CodeAnalysis/*', '**/*.csproj', '**/*.props') }}

      - name: Dotnet code style
        run: dotnet build -c Debug -warnaserror osu-framework.Desktop.slnf -p:EnforceCodeStyleInBuild=true

      - name: CodeFileSanity
        run: |
          # TODO: Add ignore filters and GitHub Workflow Command Reporting in CFS. That way we don't have to do this workaround.
          # FIXME: Suppress warnings from templates project and submodules
          exit_code=0
          while read -r line; do
            if [[ ! -z "$line" && "$line" != *"/osu.Framework.Templates/"* && "$line" != *"/submodules/"* ]]; then
              echo "::error::$line"
              exit_code=1
            fi
          done <<< $(dotnet codefilesanity)
          exit $exit_code

      - name: InspectCode
        uses: JetBrains/ReSharper-InspectCode@v0.12
        with:
          # this is WTF tier but if you don't specify *both* of these the defaults assume `build: true`
          build: false
          no-build: true
          solution: ./osu-framework.Desktop.slnf
          caches-home: inspectcode
          verbosity: WARN
          tool-version: 2026.1.0.1

  test:
    name: Test
    runs-on: ${{matrix.os.fullname}}
    env:
      OSU_EXECUTION_MODE: ${{matrix.threadingMode}}
      OSU_TESTS_LOCAL_HTTPBIN: 1
    strategy:
       fail-fast: false
       matrix:
          os:
            - { prettyname: Windows, fullname: windows-latest, configuration: Debug }
            - { prettyname: macOS, fullname: macos-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Debug }
            - { prettyname: Linux, fullname: ubuntu-latest, configuration: Release }
          threadingMode: ['SingleThread', 'MultiThreaded']
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          cache: false

      - name: Install httpbin
        run: go install github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@latest

      - name: Run httpbin
        run: $HOME/go/bin/go-httpbin &
        shell: bash

      - name: Compile
        run: dotnet build -c ${{matrix.os.configuration}} -warnaserror osu-framework.Desktop.slnf

      - name: Test
        run: dotnet test $pwd/**/*.Tests/bin/${{matrix.os.configuration}}/*/*.Tests.dll --no-build --logger "trx;LogFileName=TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx" -- NUnit.ConsoleOut=0
        shell: pwsh

      # Attempt to upload results even if test fails.
      # https://docs.github.com/en/actions/reference/context-and-expression-syntax-for-github-actions#always
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: osu-framework-test-results-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}
          path: ${{github.workspace}}/TestResults/TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}-${{matrix.os.configuration}}.trx

  build-only-android:
    name: Build only (Android)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload install android

      - name: Compile
        run: dotnet build -c Debug osu-framework.Android.slnf

  build-only-ios:
    name: Build only (iOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET workloads
        run: dotnet workload install ios

      # https://github.com/dotnet/macios/issues/19157
      # https://github.com/actions/runner-images/issues/12758
      - name: Use Xcode 26.4+
        run: |
          # Prefer the latest Xcode >= 26.4. The .NET iOS workload (net10.0_26.4) requires
          # Xcode >= 26.4; later versions (e.g. 26.5 beta) are compatible and may ship a
          # working MacOSX.sdk rather than the stub in Xcode_26.4.1.app.
          ACTIVE_XCODE=""
          for xapp in /Applications/Xcode_26.5.app /Applications/Xcode_26.4.app; do
            [ -d "$xapp" ] && ACTIVE_XCODE="$xapp" && break
          done
          echo "Using Xcode: $ACTIVE_XCODE"
          sudo xcode-select -switch "$ACTIVE_XCODE"
          # The .NET iOS SDK (Microsoft.iOS.Sdk.net10.0_26.4) constructs the MacOSX.sdk path
          # from the active Xcode developer directory and passes it to xcodebuild as a full
          # absolute path. On macos-26, Xcode_26.4.1.app ships MacOSX.sdk as a minimal stub
          # that xcodebuild rejects when given the full path. Note: `xcodebuild -sdk macosx
          # -version` exits 0 even with the stub (resolves by internal registry, not path) —
          # it cannot be used as a guard. Fix: always replace MacOSX.sdk with a symlink to
          # the best real versioned SDK from another Xcode install.
          SDKS_DIR="$ACTIVE_XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          MACOS_SDK="$SDKS_DIR/MacOSX.sdk"
          echo "=== MacOSX.sdk state ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          REAL_SDK=""
          # Extract version segment (e.g. Xcode_26.5) to exclude from search — its SDK
          # variants may also be stubs. All other Xcode_26.*.app installs are candidates.
          EXCLUDE=$(basename "$ACTIVE_XCODE" | grep -oE '^Xcode_26\.[0-9]+')
          for xapp in $(ls -d /Applications/Xcode_26.*.app 2>/dev/null | grep -v "/$EXCLUDE" | sort -rV); do
            sdk_dir="$xapp/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
            [ -d "$sdk_dir" ] || continue
            for sdk in $(ls "$sdk_dir" 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              if [ -f "$sdk_dir/$sdk/SDKSettings.plist" ]; then
                REAL_SDK="$sdk_dir/$sdk"
                echo "Found real macOS SDK in $xapp: $REAL_SDK"
                break 2
              fi
            done
          done
          # Fallback: CommandLineTools (macOS 15.x — last resort)
          if [ -z "$REAL_SDK" ]; then
            for sdk in $(ls /Library/Developer/CommandLineTools/SDKs 2>/dev/null | grep '^MacOSX[0-9].*\.sdk$' | sort -rV); do
              if [ -f "/Library/Developer/CommandLineTools/SDKs/$sdk/SDKSettings.plist" ]; then
                REAL_SDK="/Library/Developer/CommandLineTools/SDKs/$sdk"
                echo "Found macOS SDK in CLT: $REAL_SDK"
                break
              fi
            done
          fi
          if [ -n "$REAL_SDK" ]; then
            sudo rm -rf "$MACOS_SDK"
            sudo ln -sfn "$REAL_SDK" "$MACOS_SDK"
            echo "Created MacOSX.sdk symlink -> $REAL_SDK"
          else
            echo "WARNING: no valid macOS SDK found in any Xcode or CLT installation"
            for dir in "$SDKS_DIR" /Library/Developer/CommandLineTools/SDKs; do
              echo "=== $dir ==="; ls -la "$dir" 2>&1 || true
            done
          fi
          echo "=== MacOSX.sdk state after fix ==="
          ls -laH "$MACOS_SDK" 2>&1 || echo "(does not exist)"
          xcodebuild -sdk macosx -version 2>&1 || echo "(xcodebuild cannot locate macosx SDK)"

      - name: Compile
        run: dotnet build -c Debug osu-framework.iOS.slnf

